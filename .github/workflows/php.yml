name: PHP checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3','8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, sodium, simplexml, curl
          coverage: none
        env:
          fail-fast: true
      - name: Show PHP environment
        run: php -v && php -m
      - name: Verify required PHP extensions
        run: php -r '$required=["mbstring","pdo_mysql","sodium","SimpleXML","curl"]; foreach($required as $ext){if(!extension_loaded($ext)){fwrite(STDERR,"Missing PHP extension: {$ext}\n"); exit(1);}} echo "Required PHP extensions are available.\n";'
      - name: Validate Composer configuration
        run: composer validate --no-check-publish
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Verify Composer platform requirements
        run: composer check-platform-reqs --no-dev
      - name: PHP syntax
        run: find src public bin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke test
        env:
          APP_KEY: ci-test-secret-that-is-at-least-32-characters-long
          APP_ENV: test
          APP_DEBUG: false
        run: php tests/smoke.php
      - name: Security regression test
        env:
          APP_KEY: ci-test-secret-that-is-at-least-32-characters-long
          APP_ENV: test
          APP_DEBUG: false
        run: php tests/security-regression.php
